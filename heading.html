<!DOCTYPE html>
<html lang="en"><!-- This tag tells the browser that the webpage content is primarily in English.. -->

<head>
    <meta charset="UTF-8">
    <!-- is used to tell the browser which character encoding the webpage uses. In this case, it specifies that the webpage uses UTF-8 encoding, which is a widely used character encoding that can represent a wide range of characters from different languages and scripts. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEADING</title>
    <!-- is used to specify the title of the webpage, which is displayed in the browser's title bar or tab. In this case, the title of the webpage is "HEADING". -->
</head>

<body>
    <!-- is the main content area of the webpage where all the visible elements are placed. In this case, it contains a heading and a paragraph. -->
    <h1>HEADING</h1>
    <!-- is used to create a top-level heading on the webpage. It is typically used for the main title or heading of the page. In this case, it displays "HEADING" as the main heading of the webpage. -->
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolor dolorum voluptatem quas, reprehenderit
        .velit quidem minusodit odio ullam, voluptatum praesentium maiores. Quas, obcaecati voluptatum. Suscipit,
        dolorem? Similique.</p>
    <!-- is used to create a paragraph of text on the webpage. The text inside the <p> tags is displayed as a block of text with some spacing before and after it. In this case, it contains some placeholder text (Lorem ipsum) with a portion of it bolded using the <b> tag. -->

</body>
